<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bethany Neumann | Health Insurance Quote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#162546;
    --ink-2:#284A70;
    --brand-blue:#3073BA;
    --paper:#F7F5F1;
    --amber:#C9A46A;
    --amber-deep:#A9824C;
    --line:#E3DFD6;
    --muted:#8A8577;
    --muted-2:#6B6659;
    --error:#B3452F;
    --success:#3B7E5C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    font-family:'Inter',sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .widget{
    max-width:720px;
    margin:0 auto;
    padding:32px 24px 64px;
  }
  .brand-header{
    text-align:center;
    margin-bottom:28px;
  }
  .brand-header .eyebrow{
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--amber-deep);
    font-weight:600;
  }
  .brand-header h1{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-style:italic;
    font-size:32px;
    margin:6px 0 8px;
    color:var(--ink);
  }
  .brand-header p{
    color:var(--muted-2);
    font-size:14.5px;
    max-width:460px;
    margin:0 auto;
    line-height:1.5;
  }
  .brand-header .trust-line{
    font-size:11.5px;
    color:var(--muted);
    margin-top:8px;
    font-weight:500;
  }
  .bethany-bar{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-bottom:14px;
  }
  .bethany-bar .avatar{
    width:38px;height:38px;border-radius:50%;
    border:2px solid var(--amber);
    overflow:hidden;
    flex-shrink:0;
  }
  .bethany-bar .avatar img{width:100%;height:100%;object-fit:cover;display:block;}
  .bethany-bar .who{text-align:left;}
  .bethany-bar .who .name{font-size:13.5px;font-weight:700;color:var(--ink);line-height:1.2;}
  .bethany-bar .who .role{font-size:11.5px;color:var(--muted);line-height:1.2;}

  /* Progress */
  .progress{
    display:flex;
    align-items:flex-start;
    justify-content:center;
    gap:6px;
    margin:20px 0 28px;
  }
  .progress .step-col{display:flex; flex-direction:column; align-items:center; gap:6px; width:70px;}
  .progress .step-col .step-label{
    font-size:10px; color:var(--muted); font-weight:600;
    text-transform:uppercase; letter-spacing:0.03em; margin:0;
  }
  .progress .step-col.active .step-label{color:var(--ink-2);}
  .progress .dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--line);
    transition:background .25s ease;
  }
  .progress .dot.active{background:var(--amber-deep);}
  .progress .dot.done{background:var(--ink-2);}
  .progress .bar{
    width:36px;height:2px;background:var(--line);
    margin-top:4px;
  }
  .progress .bar.done{background:var(--ink-2);}

  .card{
    background:#fff;
    border:1px solid var(--line);
    border-radius:14px;
    padding:32px;
    animation:cardIn .28s ease;
  }
  @keyframes cardIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .step-label{
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--muted);
    font-weight:600;
    margin-bottom:4px;
  }
  .step-title{
    font-family:'Fraunces',serif;
    font-size:22px;
    font-weight:500;
    margin:0 0 20px;
    color:var(--ink);
  }

  .field-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-bottom:14px;
  }
  .field{margin-bottom:14px;}
  label{
    display:block;
    font-size:12.5px;
    font-weight:600;
    color:var(--ink-2);
    margin-bottom:5px;
  }
  label .req{color:var(--error);}
  .passport-note{
    font-size:11.5px; color:var(--muted); margin-top:6px; line-height:1.4;
  }
  input[type=text], input[type=email], input[type=tel], input[type=number], select, textarea{
    width:100%;
    padding:10px 12px;
    border:1.5px solid var(--line);
    border-radius:8px;
    font-family:'Inter',sans-serif;
    font-size:14px;
    color:var(--ink);
    background:#fff;
    transition:border-color .15s ease;
  }
  textarea{resize:vertical; min-height:58px;}
  input:focus, select:focus, textarea:focus{
    outline:none;
    border-color:var(--brand-blue);
  }
  .radio-group{
    display:flex;
    gap:10px;
  }
  .radio-pill{
    flex:1;
    text-align:center;
    padding:10px 12px;
    border:1.5px solid var(--line);
    border-radius:8px;
    cursor:pointer;
    font-size:13.5px;
    font-weight:600;
    color:var(--muted-2);
    transition:all .15s ease;
    user-select:none;
  }
  .radio-pill:hover{border-color:var(--muted);}
  .radio-pill.selected{
    border-color:var(--ink-2);
    background:var(--ink-2);
    color:#fff;
  }
  .checkbox-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:6px;
  }
  .checkbox-item{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13.5px;
    color:var(--muted-2);
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:7px;
    cursor:pointer;
  }
  .checkbox-item input{width:auto;margin:0;}
  .checkbox-item.checked{border-color:var(--amber-deep); background:#FBF6ED;}

  .section-divider{
    border:none;
    border-top:1px solid var(--line);
    margin:24px 0;
  }
  .applicant-card{
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px;
    margin-bottom:12px;
    position:relative;
  }
  .applicant-card .remove-btn{
    position:absolute;
    top:12px; right:12px;
    font-size:12px;
    color:var(--error);
    cursor:pointer;
    font-weight:600;
    background:none;
    border:none;
  }
  .add-applicant-btn{
    width:100%;
    padding:10px;
    border:1.5px dashed var(--line);
    border-radius:8px;
    background:none;
    color:var(--ink-2);
    font-weight:600;
    font-size:13.5px;
    cursor:pointer;
    margin-top:4px;
  }
  .add-applicant-btn:hover{border-color:var(--ink-2);}
  .add-actions{display:flex; gap:10px;}
  .add-action{
    flex:1;
    display:flex; align-items:center; justify-content:center; gap:7px;
    padding:12px 10px;
    border:1.5px dashed var(--line);
    border-radius:8px;
    background:none;
    color:var(--ink-2);
    font-weight:600;
    font-size:13.5px;
    cursor:pointer;
    transition:all .15s ease;
  }
  .add-action:hover{border-color:var(--amber-deep); color:var(--amber-deep); border-style:solid;}
  .add-action.added{
    border-style:solid; border-color:var(--line); color:var(--muted); cursor:default; opacity:0.65;
  }
  @media (max-width:400px){ .add-actions{flex-direction:column;} }

  .nav-row{
    display:flex;
    justify-content:space-between;
    margin-top:28px;
  }
  button.primary{
    background:var(--ink-2);
    color:#fff;
    border:none;
    padding:12px 26px;
    border-radius:8px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    font-family:'Inter',sans-serif;
    transition:background .15s ease;
  }
  button.primary:hover{background:var(--ink);}
  button.secondary{
    background:none;
    border:1.5px solid var(--line);
    color:var(--muted-2);
    padding:12px 22px;
    border-radius:8px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  button.secondary:hover{border-color:var(--muted);}
  .error-text{
    color:var(--error);
    font-size:12.5px;
    margin-top:4px;
  }

  /* Results */
  .result-header{
    text-align:center;
    margin-bottom:24px;
  }
  .result-header .badge{
    display:inline-block;
    background:#FBF6ED;
    border:1px solid var(--amber);
    color:var(--amber-deep);
    font-size:11.5px;
    font-weight:700;
    letter-spacing:0.05em;
    text-transform:uppercase;
    padding:5px 14px;
    border-radius:20px;
    margin-bottom:12px;
  }
  .result-header h2{
    font-family:'Fraunces',serif;
    font-size:26px;
    font-weight:500;
    margin:0 0 6px;
  }
  .result-header p{color:var(--muted-2); font-size:14px;}

  .quote-box{
    border:1.5px solid var(--ink-2);
    border-radius:12px;
    overflow:hidden;
    margin-bottom:20px;
  }
  .quote-box .carrier-strip{
    background:var(--ink-2);
    color:#fff;
    padding:14px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .quote-box .carrier-strip .carrier-name{
    font-family:'Fraunces',serif;
    font-size:18px;
  }
  .quote-box .carrier-strip .annual-total{
    font-size:22px;
    font-weight:700;
  }
  .quote-line-items{padding:16px 20px;}
  .line-item{
    display:flex;
    justify-content:space-between;
    padding:8px 0;
    font-size:13.5px;
    border-bottom:1px solid var(--line);
  }
  .line-item:last-child{border-bottom:none;}
  .line-item .name{color:var(--muted-2);}
  .line-item .amount{font-weight:600;color:var(--ink);}

  .disclaimer{
    background:#F7F5F1;
    border-radius:8px;
    padding:14px 16px;
    font-size:12.5px;
    color:var(--muted-2);
    line-height:1.5;
    margin-bottom:20px;
  }

  .cta-row{display:flex; gap:10px;}
  .cta-row button{flex:1;}

  .demo-flag{
    text-align:center;
    font-size:11px;
    color:var(--muted);
    margin-top:28px;
    letter-spacing:0.03em;
  }

  .resources{margin-top:26px; padding-top:20px; border-top:1px solid var(--line);}
  .resources .heading{
    font-size:12px; font-weight:700; color:var(--ink-2); margin-bottom:12px; text-align:center;
  }
  .resource-row{display:flex; flex-direction:column; gap:8px; max-width:380px; margin:0 auto;}
  .resource-item{
    display:flex; align-items:center; gap:11px; padding:10px 12px;
    border:1px solid var(--line); border-radius:11px; text-decoration:none;
    color:var(--ink-2); font-size:13px; font-weight:600; transition:border-color .15s ease;
  }
  .resource-item:hover{border-color:var(--amber-deep);}
  .resource-item .r-icon{
    width:30px;height:30px;border-radius:50%;background:var(--paper);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .resource-item .r-text{display:flex; flex-direction:column; gap:1px; text-align:left;}
  .resource-item .r-sub{font-size:11px; font-weight:500; color:var(--muted);}

  @media (max-width:520px){
    .field-row{grid-template-columns:1fr;}
    .checkbox-grid{grid-template-columns:1fr;}
    .widget{padding:20px 14px 48px;}
    .card{padding:22px 18px;}
  }
</style>
</head>

// Nearest-band fallback for carriers with sparse age samples (BMI USA, Bupa) --
// finds the band whose midpoint is closest to the applicant's age, rather
// than requiring an exact match.
function findBandNearest(bands, age){
  const exact = bands.find(b => age >= b.min && age <= b.max);
  if(exact) return exact;
  let closest = null, closestDist = Infinity;
  for(const b of bands){
    const mid = (b.min + b.max) / 2;
    const dist = Math.abs(age - mid);
    if(dist < closestDist){ closest = b; closestDist = dist; }
  }
  return closest;
}

function findBand(bands, age){
  return bands.find(b => age >= b.min && age <= b.max);
}

// Computes one carrier's quote for a given set of applicants + deductible.
// Returns {total, lineItems} or null if this carrier doesn't apply (age
// out of range, family size unsupported, etc) -- callers should just skip
// this carrier rather than treat it as an error.
// Real eligibility restrictions, taken from the carrier reference data:
//  - VUMI Gold and VUMI Platinum are sold only to USA, Canadian and
//    European passport holders.
//  - Bupa National Plus requires confirmed Mexican residency.
// These are family policies, so EVERY applicant (main + dependents) must
// individually satisfy the rule -- one family member with a disqualifying
// passport or without residency means this carrier isn't offered for the
// family at all, not just for that one person.
const CARRIER_ELIGIBILITY = {
  vumi_gold:          (members) => members.every(m => ['USA','Canada','Europe'].includes(m.passport)),
  vumi_platinum:      (members) => members.every(m => ['USA','Canada','Europe'].includes(m.passport)),
  bupa_national_plus: (members) => members.every(m => m.mexicoStatus === 'yes')
};

function carrierEligible(carrierKey, members){
  const rule = CARRIER_ELIGIBILITY[carrierKey];
  return rule ? rule(members) : true;
}

function calculateCarrierQuote(carrierKey, applicants, deductible){
  const carrier = RATES[carrierKey];
  if(!carrierRatesValid(carrierKey)) return null; // stale rates -- skip this carrier, others still work
  const lineItems = [];

  if(carrier.pricing_model === "household_tier"){
    // VUMI Optimum: whole-policy total looked up by tier, NOT per-person additive
    if(applicants.length > 2) return null; // family tier intentionally not supported
    const tierBands = applicants.length === 1 ? carrier.tiers.individual : carrier.tiers.couple;
    const lookupAge = applicants.length === 1 ? parseInt(applicants[0].age) : Math.max(...applicants.map(a=>parseInt(a.age)));
    const band = findBand(tierBands, lookupAge);
    if(!band || band[deductible] == null) return null;
    const total = Math.round((band[deductible] + carrier.admin_fee) * 100) / 100;
    lineItems.push({label: applicants.length === 1 ? `Individual policy (age ${lookupAge})` : `Couple policy (older applicant age ${lookupAge})`, amount: band[deductible]});
    lineItems.push({label: `${carrier.label} policy fee`, amount: carrier.admin_fee});
    return {carrierLabel: carrier.label, lineItems, total};
  }

  if(carrier.pricing_model === "peso_iva"){
    // Bupa: gender-rated pesos, sum + admin fee, then *1.16 IVA
    let subtotal = 0;
    for(let i=0;i<applicants.length;i++){
      const a = applicants[i];
      const age = parseInt(a.age);
      const band = findBandNearest(carrier.bands, age);
      if(!band || !band[deductible]) return null;
      const rate = a.gender === 'female' ? band[deductible].f : band[deductible].m;
      subtotal += rate;
      lineItems.push({label: (i===0?'Main applicant':`Dependent ${i}`) + ` (age ${age}, MXN)`, amount: rate});
    }
    const total = Math.round((subtotal + carrier.admin_fee) * carrier.tax_multiplier);
    lineItems.push({label: `${carrier.label} policy fee (MXN, before IVA)`, amount: carrier.admin_fee});
    return {carrierLabel: carrier.label, lineItems, total, currency: "MXN"};
  }

  // All other pricing models: per-applicant lookup, then combine
  //
  // Some carriers (BMI Ideal No USA, BMI Ideal USA, VUMI Special) do NOT have
  // per-age rates for children. They charge ONE bundled amount based on how
  // many children are on the policy. Without this, the per-age lookup returns
  // nothing for a child and the whole carrier silently disappears from the
  // comparison. Children are pooled here and priced once.
  //
  // A dependent under 18 is treated as a child. The source tables allow child
  // rates up to age 23, but we only apply them below 18 -- an 18-to-23-year-old
  // dependent gets the adult rate, which is higher, so we never under-quote.
  const CHILD_MAX_AGE = 17;
  let adults = applicants, children = [];
  if(carrier.child_rates){
    adults = applicants.filter((a,i) => i === 0 || parseInt(a.age) > CHILD_MAX_AGE);
    children = applicants.filter((a,i) => i !== 0 && parseInt(a.age) <= CHILD_MAX_AGE);
  }

  let subtotal = 0;
  for(let i=0;i<adults.length;i++){
    const a = adults[i];
    const age = parseInt(a.age);
    if(carrier.min_age != null && age < carrier.min_age) return null;
    if(carrier.max_age != null && age > carrier.max_age) return null;
    const useNearest = carrier.band_step_note != null;
    const band = useNearest ? findBandNearest(carrier.bands, age) : findBand(carrier.bands, age);
    if(!band) return null;
    let rate;
    if(carrier.pricing_model === "fee_added_unisex" || carrier.pricing_model === "composite_additive" || carrier.pricing_model === "fee_included_unisex" || carrier.pricing_model === "monthly_additive_unisex"){
      rate = band[deductible];
    } else {
      // fee_added, gender-rated
      rate = a.gender === 'female' ? band[deductible].f : band[deductible].m;
    }
    if(rate == null) return null;
    subtotal += rate;
    lineItems.push({label: (i===0?'Main applicant':`Dependent ${i}`) + ` (age ${age})`, amount: rate});
  }

  if(children.length){
    const bucket = children.length >= 3 ? 3 : children.length;
    const childRate = carrier.child_rates[bucket] && carrier.child_rates[bucket][deductible];
    if(childRate == null) return null;
    subtotal += childRate;
    lineItems.push({
      label: children.length === 1
        ? `1 dependent child (age ${children[0].age})`
        : `${children.length} dependent children (ages ${children.map(c=>c.age).join(', ')})`,
      amount: childRate
    });
  }

  let total;
  if(carrier.pricing_model === "fee_included_unisex"){
    // Morgan White: fee already baked into each person's rate; only charged once total
    // (uses adults.length, which equals applicants.length for this carrier since
    // it has no bundled child rates -- but keeps the maths tied to what was priced)
    const feeAdjustment = (adults.length - 1) * carrier.admin_fee;
    total = Math.round((subtotal - feeAdjustment) * 100) / 100;
  } else if(carrier.pricing_model === "composite_additive"){
    // IMG: fee already included per-person composite, no separate fee line
    total = Math.round(subtotal * 100) / 100;
  } else if(carrier.pricing_model === "monthly_additive_unisex"){
    // GeoBlue: monthly rates, annualize
    total = Math.round(subtotal * 12);
    lineItems.push({label: "(GeoBlue rates are monthly estimates, annualized here)", amount: 0});
  } else {
    // fee_added / fee_added_unisex: add the policy fee once
    total = Math.round((subtotal + carrier.admin_fee) * 100) / 100;
    lineItems.push({label: `${carrier.label} policy fee`, amount: carrier.admin_fee});
  }

  return {carrierLabel: carrier.label, lineItems, total};
}

  const validThrough = RATE_VALID_THROUGH[carrierKey];
  if(!validThrough) return false; // no confirmed date on file = don't auto-quote it
  return new Date() <= new Date(validThrough + 'T23:59:59');
}

function checkDisqualification(applicants, hasConditions, conditionDetail){
  if(hasConditions === 'yes'){
    return {disqualified: true, reason: 'preexisting_condition', detail: conditionDetail || 'Not specified'};
  }
  const oldestAge = Math.max(...applicants.map(a => parseInt(a.age)));
  const youngestAge = Math.min(...applicants.map(a => parseInt(a.age)));
  if(oldestAge > 80 || youngestAge < 0){
    return {disqualified: true, reason: 'age_out_of_range', detail: `Ages ${youngestAge}-${oldestAge}`};
  }
  return {disqualified: false};
}

function determineBracketKey(applicants, wantsUSA, wantsMaternity){
  const oldestAge = Math.max(...applicants.map(a => parseInt(a.age)));
  if(wantsMaternity) return "maternity";
  if(wantsUSA) return "usaincluded";
  if(oldestAge <= 59) return "under60";
  if(oldestAge <= 64) return "over60";
  if(oldestAge <= 69) return "over65";
  return "oldpeople";
}

// Computes every carrier's quote for a bracket, silently skipping any
// carrier that doesn't apply to this specific applicant mix (age out of
// range, family size unsupported, etc) rather than failing the whole quote.
function calculateAllQuotesForBracket(bracketKey, applicants, ctx){
  const bracketDef = BRACKETS[bracketKey];
  const plans = [];
  for(const c of bracketDef.carriers){
    if(ctx && !carrierEligible(c.key, ctx)) continue; // passport / residency restriction
    const result = calculateCarrierQuote(c.key, applicants, c.deductible);
    if(result){
      plans.push({...result, carrierKey: c.key, recommended: c.recommended, deductible: c.deductible});
    }
  }
  // If the bracket's default "recommended" carrier was filtered out, promote
  // the first remaining plan so the PDF always has exactly one badge.
  if(plans.length && !plans.some(p => p.recommended)) plans[0].recommended = true;
  return {bracket: bracketDef.bracket, deductibleChip: bracketDef.deductibleChip, plans};
}

function el(tag, props={}, children=[]){
  const e = document.createElement(tag);
  Object.entries(props).forEach(([k,v]) => {
    if(k === 'class') e.className = v;
    else if(k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), v);
    else if(k === 'html') e.innerHTML = v;
    else e.setAttribute(k, v);
  });
  (Array.isArray(children) ? children : [children]).forEach(c => {
    if(c == null) return;
    e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return e;
}

  const wrap = el('div',{class:'radio-group'});
  options.forEach(opt => {
    const pill = el('div',{class:'radio-pill' + (value === opt.value ? ' selected' : ''), onClick: () => { onChange(opt.value); render(); }}, opt.label);
    wrap.appendChild(pill);
  });
  return wrap;
}

// Phone field: country code selector + a number input capped at 10 digits.
// Strips any non-digit the person types/pastes, so formatting from a
// contacts app doesn't produce a malformed number in Close.
function phoneField(){
  const wrap = el('div',{class:'field'});
  wrap.appendChild(el('label',{},['Phone number', el('span',{class:'req'},' *')]));

  const row = el('div',{style:'display:flex; gap:8px;'});

  const codeSel = el('select',{style:'flex:0 0 auto; width:170px;'});
  COUNTRY_CODES.forEach(cc => {
    const o = el('option',{value:cc.code}, cc.label);
    if(cc.code === state.contact.countryCode) o.setAttribute('selected','selected');
    codeSel.appendChild(o);
  });
  codeSel.addEventListener('change', e => { state.contact.countryCode = e.target.value; render(); });
  row.appendChild(codeSel);

  if(state.contact.countryCode === 'other'){
    const customIn = el('input',{type:'text', placeholder:'+__', style:'flex:0 0 auto; width:72px;'});
    customIn.value = state.contact.customCode;
    customIn.addEventListener('input', e => {
      let v = e.target.value.replace(/[^0-9+]/g,'');
      if(v && !v.startsWith('+')) v = '+' + v.replace(/\+/g,'');
      state.contact.customCode = v.slice(0,5);
      e.target.value = state.contact.customCode;
    });
    row.appendChild(customIn);
  }

  const phoneIn = el('input',{type:'tel', inputmode:'numeric', placeholder:'10 digits', style:'flex:1 1 auto;'});
  phoneIn.value = state.contact.phone;
  phoneIn.addEventListener('input', e => {
    const digits = e.target.value.replace(/\D/g,'').slice(0,10);
    state.contact.phone = digits;
    e.target.value = digits;
  });
  row.appendChild(phoneIn);

  wrap.appendChild(row);
  wrap.appendChild(el('div',{style:'font-size:11.5px;color:var(--muted);margin-top:4px;'},
    '10 digits, no spaces or dashes needed'));
  return wrap;
}

function validateStep1(){
  const m = state.main;
  if(!state.contact.firstName || !state.contact.lastName || !m.age || !m.mexicoStatus){
    state.errors.step1 = 'Please fill in all required fields before continuing.';
    return false;
  }
  for(const dep of state.dependents){
    if(!dep.age){ state.errors.step1 = 'Please enter an age for every additional applicant.'; return false; }
    if(!dep.passport){ state.errors.step1 = 'Please select a passport type for every additional applicant.'; return false; }
    if(!dep.mexicoStatus){ state.errors.step1 = 'Please answer the residency question for every additional applicant.'; return false; }
  }
  state.errors.step1 = null;
  return true;
}

function validateStep2(){

function validateStep3(){
  const c = state.contact;
  if(!c.email || !c.phone){
    state.errors.step3 = 'Please fill in all required fields before submitting.';
    return false;
  }
  if(c.phone.replace(/\D/g,'').length !== 10){
    state.errors.step3 = 'Please enter a 10-digit phone number.';
    return false;
  }
  if(c.countryCode === 'other' && !c.customCode){
    state.errors.step3 = 'Please enter your country calling code (for example +44).';
    return false;
  }
  state.errors.step3 = null;
  return true;
}

async function getQuote(){
  const applicants = [{gender: state.main.gender, age: state.main.age}, ...state.dependents];

  // Kill switch: if disabled backend-wide, everything routes to manual,
  // no exceptions. Checked first, before any other logic.
  if(!AUTO_QUOTE_ENABLED){
    state.result = {manualReview: true, reason: 'auto_quote_disabled', detail: 'Auto-quote system is currently paused'};
  } else {
    // Preexisting conditions / age range gating
    const gate = checkDisqualification(applicants, state.hasConditions, state.conditionDetail);
    if(gate.disqualified){
      state.result = {manualReview: true, reason: gate.reason, detail: gate.detail};
    } else {
      const bracketKey = determineBracketKey(applicants, state.wantsUSA, state.wantsMaternity);
      const eligibilityMembers = [
        {passport: state.main.passport, mexicoStatus: state.main.mexicoStatus},
        ...state.dependents.map(d => ({passport: d.passport, mexicoStatus: d.mexicoStatus}))
      ];

      try{
        const {bracket, deductibleChip, plans} = calculateAllQuotesForBracket(bracketKey, applicants, eligibilityMembers);
        if(!plans.length){
          state.result = {manualReview: true, reason: 'no_carriers_available', detail: `No carrier in the ${bracket} bracket covers this applicant mix (age/family size)`};
        } else {
          state.result = {manualReview: false, bracket, deductibleChip, plans};
        }
      } catch(e){
        state.result = {manualReview: true, reason: 'calculation_error', detail: e.message};
      }
    }
  }

  // Send everything to the backend, if it's configured. This is what
  // actually creates the Close lead and (if not flagged manualReview)
  // generates + links the PDF. Runs quietly in the background \u2014 the
  // client-facing confirmation message shows either way, so a slow or
  // failed submission never blocks or confuses the person filling out
  // the form.
  if(BACKEND_URL){
    try{
      await fetch(`${BACKEND_URL}/submit-quote-request`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          firstName: state.contact.firstName,
          lastName: state.contact.lastName,
          email: state.contact.email,
          phone: fullPhone(),
          referral: state.contact.referral,
          passport: state.main.passport,
          mexicoStatus: state.main.mexicoStatus,
          mainApplicant: {gender: state.main.gender, age: state.main.age},
          dependents: state.dependents,
          conditions: state.hasConditions === 'yes' ? [state.conditionDetail || 'Not specified'] : [],
          comments: state.comments,
          wantsUSA: state.wantsUSA,
          wantsMaternity: state.wantsMaternity,
          manualReview: state.result.manualReview,
          reason: state.result.reason || null,
          detail: state.result.detail || null,
          bracket: state.result.bracket || null,
          deductibleChip: state.result.deductibleChip || null,
          plans: state.result.plans || []
        })
      });
    } catch(e){
      // Network/backend failure shouldn't break the client's experience.
      // Bethany/Reyna just won't see this lead auto-logged in Close and
      // will need to catch it another way \u2014 worth monitoring during
      // testing, but never shown to the client.
      console.error('Backend submission failed:', e);
    }
  }
}

    el('div',{class:'r-text'},[el('span',{},'Say hello'), el('span',{class:'r-sub'},'Facebook \u2014 Expat Insurance Services')])
  ]));
  resources.appendChild(row);

  // Internal-only visibility for this prototype so Reyna can see gating

      `[Internal preview only] Routed to manual review \u2014 ${state.result.reason}${state.result.detail ? ': ' + state.result.detail : ''}`
    ));
  } else if(DEBUG){
    const planSummary = state.result.plans.map(p => `${p.carrierLabel}${p.recommended ? ' (recommended)' : ''}: ${p.currency === 'MXN' ? '$' + p.total.toLocaleString() + ' MXN' : '$' + p.total.toLocaleString()}`).join(' | ');
    wrap.appendChild(el('div',{style:'margin-top:14px;text-align:center;font-size:11.5px;color:var(--muted);'},
      `[Internal preview only] ${state.result.bracket} \u2014 ${state.result.plans.length} plan(s): ${planSummary}`
    ));

// BACKEND_URL: set this once the backend is deployed, e.g.
// 'https://bethany-auto-quote.onrender.com'. Left blank for now, so the
// widget runs standalone and defaults AUTO_QUOTE_ENABLED to true.
const BACKEND_URL = 'https://bethany-auto-quote.onrender.com';

async function initConfig(){
  // Render immediately -- don't make the client stare at a blank page
  // waiting on the backend. Render.com's free tier can take 30-60+
  // seconds to wake up from a cold start; there's no reason that delay
  // should block the FORM from showing, since the config check only
  // matters at the final submit step, by which point the client has
  // spent a minute or two filling out three steps anyway.
  render();

  if(!BACKEND_URL) return;
  try{
    const resp = await fetch(`${BACKEND_URL}/config`);
    const config = await resp.json();
    AUTO_QUOTE_ENABLED = config.auto_quote_enabled;
  } catch(e){
    // If the backend is unreachable, fail safe: keep auto-quoting OFF
    // rather than silently guessing it's fine.
    AUTO_QUOTE_ENABLED = false;
  }
  // Only re-render if this resolved before the client reached the
  // confirmation screen -- avoids yanking the UI out from under them
  // if they've already submitted.
  if(!state.result) render();
}

initConfig();
